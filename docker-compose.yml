# Postgres mode: owner (migrations and loading), app_readonly (answers questions), app_audit (writes the audit log).
# Local development credentials only. See .env.example for the matching URLs.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: copilot_owner
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: copilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # A named volume, so `docker compose down` then `up` keeps the data (audit log, preferences, cursor).
      # `docker compose down -v` deletes it on purpose.
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro

volumes:
  pgdata:
