# Weekly dependency updates: every Monday, one minor-and-patch PR for the copilot and one for alerts, so React and
# react-dom always move together inside each PR. Dependabot groups per directory, so the two apps arrive as two PRs:
# merge them together, or the apps drift onto different versions (docs/CODING-STANDARDS.md asks that they match).
# Majors stay as their own PRs. GitHub Actions get one weekly PR for minor and patch updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    groups:
      copilot-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /alerts
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    groups:
      alerts-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
