# Static analysis (PRD S5). Code scanning upload needs GitHub Advanced Security, which this private
# repo does not have, so results are kept as a SARIF artifact and the job fails on any finding.
name: codeql

on:
  push:
    branches: [main, 'week*']
  pull_request:
    # A PR that changes only documentation has no code to analyse; main and the weekly run still scan everything.
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  actions: read


# A newer push to a PR cancels that PR's older run (Actions minutes are billed, review Oct 31). Every other run (a merge
# to main, the schedule, a manual run) gets a group of its own, because a group keeps only one pending run and would
# cancel the checks of a merge queued behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: sarif-results
      - name: Fail on findings
        run: |
          n=$(jq '[.runs[].results[]] | length' sarif-results/*.sarif)
          echo "CodeQL findings: $n"
          jq -r '.runs[].results[] | "\(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' sarif-results/*.sarif
          test "$n" -eq 0
